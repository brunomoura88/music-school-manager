<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estúdio A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #0b0b0b;
            background-image: url("{{ url_for('static', filename='img/fundosistema.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Card de Login com Glassmorphism translúcido */
        .card-login {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid #b30000;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Inputs estilizados para tema escuro */
        .form-control {
            background-color: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .form-control:focus {
            background-color: rgba(35, 35, 35, 0.9);
            border-color: #b30000;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(179, 0, 0, 0.25);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Botão estilizado com tom vermelho do Estúdio A */
        .btn-estudio {
            background-color: #b30000;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-estudio:hover {
            background-color: #d60000;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(179, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        /* Logo com sombra para destacar sobre o fundo */
        .logo {
            max-height: 120px;
            max-width: 260px;
            width: auto;
            height: auto;
            display: inline-block;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card card-login p-4" style="width: 100%; max-width: 400px;">
            
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Estúdio A" class="logo">
            </div>

            <form action="/" method="POST">
                <div class="mb-3 text-start">
                    <label for="cpf" class="form-label text-white fw-bold">Login (Acesso do Professor)</label>
                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Digite seu usuário ou CPF" required>
                </div>
                
                <div class="mb-4">
                    <label for="senha" class="form-label text-light small">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="btn btn-estudio w-100 fw-bold">ENTRAR NO SISTEMA</button>
            </form>

        </div>
    </div>
</body>
</html>
