<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estúdio A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login {
            background-color: #262626;
            border-top: 5px solid #800000;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .btn-estudio {
            background-color: #800000;
            color: white;
            border: none;
            transition: background 0.3s;
        }
        .btn-estudio:hover { background-color: #a00000; color: white; }
        /* Logo sizing: preserve aspect ratio */
        .logo {
            max-height: 120px;
            max-width: 260px;
            width: auto;
            height: auto;
            display: inline-block;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card card-login p-4" style="width: 100%; max-width: 400px;">
        
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Estúdio A" class="logo">
        </div>

        <form action="/" method="POST">
            <div class="mb-3">
                <label for="cpf" class="form-label text-light small">CPF (Acesso do Professor)</label>
                <input type="text" class="form-control" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
            </div>
            
            <div class="mb-4">
                <label for="senha" class="form-label text-light small">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn btn-estudio w-100 fw-bold">ENTRAR NO SISTEMA</button>
        </form>

    </div>
</div>
</body>
</html>
