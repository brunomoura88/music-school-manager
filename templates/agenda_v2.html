<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio A - Agenda Avançada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@v5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/pt-br.global.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar-estudio {
            background-color: #0b0b0b;
            border-bottom: 3px solid #800020;
        }
        .calendar-container {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        /* Customizando o FullCalendar para Modo Escuro */
        .fc {
            --fc-border-color: #2d2d2d;
            --fc-daygrid-event-dot-color: #800020;
            --fc-button-bg-color: #800020;
            --fc-button-border-color: #800020;
            --fc-button-hover-bg-color: #a00028;
            --fc-button-hover-border-color: #a00028;
            --fc-button-active-bg-color: #d4af37;
            --fc-button-active-border-color: #d4af37;
            --fc-today-bg-color: rgba(212, 175, 55, 0.05);
        }
        .fc .fc-toolbar-title {
            font-size: 1.2rem; /* Reduzido para caber no mobile */
            font-weight: bold;
            text-transform: capitalize;
            color: #d4af37;
        }
        .fc a { color: #ffffff; text-decoration: none; }
        .fc-timegrid-slot { height: 3.5em !important; }
        
        /* Ajustes específicos de Responsividade (Mobile First) */
        @media (max-width: 767px) {
            .fc .fc-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .fc .fc-toolbar-title {
                font-size: 1.1rem;
                text-align: center;
                display: block;
                margin: 5px 0;
            }
            .calendar-container {
                padding: 8px;
                border-radius: 8px;
            }
            .fc-header-toolbar {
                margin-bottom: 1rem !important;
            }
            /* Suaviza as colunas espremidas das datas no topo */
            .fc-col-header-cell-cushion {
                font-size: 11px;
                padding: 2px !important;
            }
        }

        /* Modal Estilizado */
        .modal-content-custom {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: white;
        }
        .modal-header-custom {
            border-bottom: 1px solid #333;
            background-color: #0b0b0b;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-estudio px-3 py-2 px-md-4 py-md-3">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <span class="navbar-brand p-0 fw-bold text-uppercase tracking-wider fs-6 fs-md-5">
                <i class="bi bi-calendar3 text-warning me-1"></i> Agenda
            </span>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-warning btn-sm fw-bold px-2 px-md-3" data-bs-toggle="modal" data-bs-target="#modalNovoEvento">
                    <i class="bi bi-plus-circle-fill me-1"></i> Novo
                </button>
                <a href="/dashboard" class="btn btn-outline-light btn-sm px-2 px-md-3">Voltar</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid container-md my-3 my-md-5">
        <div class="calendar-container">
            <div id="calendar"></div>
        </div>
    </div>

    <div class="modal fade" id="modalNovoEvento" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title text-warning fw-bold"><i class="bi bi-alarm me-2"></i>Agendar Horário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-shadow="none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form action="/api/eventos/salvar" method="POST">
                    <div class="modal-body p-3 p-md-4">
                        
                        <div class="mb-3">
                            <label class="form-label small text-white-50">Tipo de Evento</label>
                            <select class="form-select bg-dark text-white border-secondary" name="tipo_evento" id="tipoEvento" required onchange="ajustarFormulario()">
                                <option value="Aula">Aula Normal</option>
                                <option value="Recuperacao">Aula de Recuperação</option>
                                <option value="Bloqueio">Bloqueio de Horário (Diarista / Recessos)</option>
                                <option value="Feriado">Feriado / Folga Geral</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-white-50">Título / Nome da Rotina</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" name="titulo" id="campoTitulo" placeholder="Ex: Aula de Música ou Limpeza Geral" required>
                        </div>

                        <div class="mb-3" id="blocoAlunos">
                            <label class="form-label small text-white-50">Alunos (Segure CTRL para Duplas/Trios)</label>
                            <select class="form-select bg-dark text-white border-secondary" name="alunos_ids" multiple style="height: 110px;">
                                {% for a in alunos %}
                                <option value="{{ a.id }}">{{ a.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6" id="blocoProfessor">
                                <label class="form-label small text-white-50">Professor</label>
                                <select class="form-select bg-dark text-white border-secondary" name="id_professor">
                                    <option value="">Selecione...</option>
                                    {% for p in professores %}
                                    <option value="{{ p.id }}">{{ p.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-6" id="blocoDisciplina">
                                <label class="form-label small text-white-50">Disciplina</label>
                                <select class="form-select bg-dark text-white border-secondary" name="id_disciplina">
                                    <option value="">Selecione...</option>
                                    {% for d in disciplinas %}
                                    <option value="{{ d.id }}">{{ d.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-12 col-md-4">
                                <label class="form-label small text-white-50">Data</label>
                                <input type="date" class="form-control bg-dark text-white border-secondary" name="data_evento" required>
                            </div>
                            <div class="col-6 col-md-4">
                                <label class="form-label small text-white-50">Início</label>
                                <input type="time" class="form-control bg-dark text-white border-secondary" name="horario_inicio" required>
                            </div>
                            <div class="col-6 col-md-4">
                                <label class="form-label small text-white-50">Término</label>
                                <input type="time" class="form-control bg-dark text-white border-secondary" name="horario_fim" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small text-white-50">Regra de Recorrência</label>
                            <select class="form-select bg-dark text-white border-secondary" name="recorrencia" id="recorrencia">
                                <option value="Nenhuma">Ocorre apenas nessa data</option>
                                <option value="Semanal">Toda semana nesse dia e horário</option>
                                <option value="Quinzenal_Sim_Nao">Quinzenal (Uma semana Sim, outra Não)</option>
                            </select>
                        </div>

                    </div>
                    <div class="modal-footer border-top border-dark bg-opacity-10 bg-black">
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning btn-sm fw-bold px-4">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@v5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            # Inteligência de Responsividade: Se a tela for menor que 768px, abre na visão de "Dia"
            var visaoInicial = window.innerWidth < 768 ? 'timeGridDay' : 'timeGridWeek';

            var calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'pt-br',
                initialView: visaoInicial,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: window.innerWidth < 768 ? 'timeGridWeek,timeGridDay' : 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                slotMinTime: '07:00:00',
                slotMaxTime: '22:00:00',
                allDaySlot: false,
                height: 'auto',
                contentHeight: 'auto',
                handleWindowResize: true,
                expandRows: true,
                events: '/api/eventos',
                
                eventClick: function(info) {
                    if(confirm("Deseja ver ou remover o evento: " + info.event.title + "?")) {
                        // Implementação futura de exclusão
                    }
                }
            });
            calendar.render();
        });

        function ajustarFormulario() {
            var tipo = document.getElementById("tipoEvento").value;
            var blocoAlunos = document.getElementById("blocoAlunos");
            var blocoProf = document.getElementById("blocoProfessor");
            var blocoDisc = document.getElementById("blocoDisciplina");
            var campoTitulo = document.getElementById("campoTitulo");

            if (tipo === "Bloqueio" || tipo === "Feriado") {
                blocoAlunos.style.display = "none";
                blocoProf.style.display = "none";
                blocoDisc.style.display = "none";
                campoTitulo.value = tipo === "Bloqueio" ? "BLOQUEIO - Limpeza" : "FERIADO";
            } else {
                blocoAlunos.style.display = "block";
                blocoProf.style.display = "block";
                blocoDisc.style.display = "block";
                campoTitulo.value = "";
            }
        }
    </script>
</body>
</html>
